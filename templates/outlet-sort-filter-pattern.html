<!-- wp:group {"layout":{"type":"flex","flexWrap":"nowrap","justifyContent":"right"}} -->
<div class="wp-block-group"><!-- wp:html -->
<style data-wp-block-html="css">
#orderby { width: auto; }
</style>

<script data-wp-block-html="js">
document.addEventListener(
  'DOMContentLoaded',
  function() {
    const select =
      document.getElementById(
        'orderby'
      );

    if ( ! select ) {
      return;
    }

    const options = [
      {
        value: '',
        label:
          'Default sorting',
      },
      {
        value:
          'popularity',
        label:
          'Sort by popularity',
      },
      {
        value: 'rating',
        label:
          'Sort by average rating',
      },
      {
        value: 'date',
        label:
          'Sort by latest',
      },
      {
        value: 'price',
        label:
          'Sort by price: low to high',
      },
      {
        value:
          'price-desc',
        label:
          'Sort by price: high to low',
      },
    ];

    const url = new URL(
      window.location.href
    );

    const currentOrderby =
      url.searchParams.get(
        'orderby'
      ) || '';

    options.forEach(
      function(
        optionData
      ) {
        const option =
          document.createElement(
            'option'
          );

        option.value =
          optionData.value;

        option.textContent =
          optionData.label;

        option.selected =
          optionData.value ===
          currentOrderby;

        select.appendChild(
          option
        );
      }
    );

    select.addEventListener(
      'change',
      function() {
        url.searchParams.set(
          'orderby',
          select.value
        );

        url.searchParams.delete(
          'paged'
        );

        window.location.href =
          url.toString();
      }
    );
  }
);
</script>

<select id="orderby" name="orderby"></select>
<!-- /wp:html --></div>
<!-- /wp:group -->
