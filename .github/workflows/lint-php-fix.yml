name: Fix PHP Lint

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-php-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.head_ref }}

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - run: npm ci

    - name: Install Composer dependencies
      run: composer install --no-scripts --no-interaction --prefer-dist

    - name: Run PHP lint fix
      run: npm run lint:php:fix

    - name: Commit fixes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git diff --quiet && git diff --staged --quiet || (git add -A && git commit -m "Fix PHP lint issues" && git push)
