name: PR Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - name: Check VERSION constant matches plugin header
      run: bash bin/version-check.sh

  unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - run: npm ci

    - name: Run unit tests
      run: npm run test:unit

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - run: npm ci

    - name: Run type check
      run: npm run typecheck

  lint-css:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - run: npm ci

    - name: Run CSS lint
      run: npm run lint:css

  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - run: npm ci

    - name: Run JS lint
      run: npm run lint:js

  lint-md-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - run: npm ci

    - name: Run Markdown docs lint
      run: npm run lint:md:docs

  lint-php:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - run: npm ci

    - name: Install Composer dependencies
      run: composer install --no-scripts --no-interaction --prefer-dist

    - name: Run PHP lint
      run: npm run lint:php

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install npm dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Start WordPress environment
      run: npm run wp-env start

    - name: Run E2E tests
      run: npm run test:e2e

    - name: Upload Playwright artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright
        path: artifacts/

    - name: Stop WordPress environment
      if: always()
      run: npm run wp-env stop

  phpunit:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [ '7.4', '8.5' ]

    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php-version }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # A recent version for composer and other tools

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Composer dependencies
      run: composer install

    - name: Run post-install script
      run: composer run-script post-install-cmd --no-interaction

    - name: Install wp-env
      run: npm install -g @wordpress/env

    - name: Start WordPress environment
      run: wp-env start

    - name: Docker container debug information
      run: |
        wp-env run tests-cli php -- --version
        wp-env run tests-cli wp core version

    - name: Run tests
      run: wp-env run tests-cli --env-cwd=wp-content/plugins/wc-clearance vendor/bin/phpunit
