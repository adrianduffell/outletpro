name: PR Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Install npm dependencies
      run: npm ci

    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Run post-install script
      run: composer run-script post-install-cmd --no-interaction

    - name: Check VERSION constant matches plugin header
      run: bash bin/version-check.sh

    - name: Run unit tests
      run: npm run test:unit

    - name: Run type check
      run: npm run typecheck

    - name: Run CSS lint
      run: npm run lint:css

    - name: Run JS lint
      run: npm run lint:js

    - name: Run Markdown docs lint
      run: npm run lint:md:docs

    - name: Run PHP lint
      run: npm run lint:php

    - name: Install SVN
      run: sudo apt-get install -y subversion

    - name: Install WordPress test suite
      run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

    - name: Install WP-CLI
      run: |
        curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        chmod +x wp-cli.phar
        sudo mv wp-cli.phar /usr/local/bin/wp

    - name: Check WP loads
      run: wp core version --path=/tmp/wordpress

    - name: Install WooCommerce
      run: wp plugin install woocommerce --activate --path=/tmp/wordpress

    - name: Run Woo setup tasks
      run: wp cron event run --due-now --path=/tmp/wordpress

    - name: Set up PHP 7.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'

    - name: Install Composer dependencies (PHP 7.4)
      run: composer install --no-interaction --prefer-dist

    - name: Run PHPUnit (PHP 7.4)
      run: composer run test

    - name: Set up PHP 8.5
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'

    - name: Install Composer dependencies (PHP 8.5)
      run: composer install --no-interaction --prefer-dist

    - name: Run PHPUnit (PHP 8.5)
      run: composer run test

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Start WordPress environment
      run: npm run wp-env start

    - name: Run E2E tests
      run: npm run test:e2e

    - name: Upload Playwright artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright
        path: artifacts/

    - name: Stop WordPress environment
      if: always()
      run: npm run wp-env stop
