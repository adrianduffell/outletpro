name: Lint

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-css:
    if: false  # No CSS files yet; re-enable when CSS is added to the project
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - run: npm ci

    - name: Run CSS lint
      run: npm run lint:css

  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - run: npm ci

    - name: Run JS lint
      run: npm run lint:js

  lint-md-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - run: npm ci

    - name: Run Markdown docs lint
      run: npm run lint:md:docs

  lint-php:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - run: npm ci

    - name: Install Composer dependencies
      run: composer install --no-scripts --no-interaction --prefer-dist

    - name: Run PHP lint
      run: npm run lint:php
