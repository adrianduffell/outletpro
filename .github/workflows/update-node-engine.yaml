name: Update Node Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */14 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Get latest Node 24 release
        id: latest
        run: |
          VERSION=$(curl -s https://nodejs.org/dist/index.json | jq -r '[.[] | select(.version | startswith("v24."))][0].version')
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Read current engine version
        id: current
        run: |
          CURRENT=$(jq -r '.engines.node' package.json)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Update package.json
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          jq \
            --arg version "${{ steps.latest.outputs.version }}" \
            '.engines.node = $version' \
            package.json > package.json.tmp

          mv package.json.tmp package.json

      - name: Update lockfile
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: npm install --package-lock-only

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="update-node-${{ steps.latest.outputs.version }}-${{ github.run_number }}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git checkout -b "$BRANCH"

          git add package.json package-lock.json
          git commit -m "Update Node engine to ${{ steps.latest.outputs.version }}"

          git push --set-upstream origin "$BRANCH"

      - name: Output diff
        if: steps.changes.outputs.changed == 'true'
        run: |
          git diff -- package.json
