name: E2E Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Install npm dependencies
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Cache wp-env Docker images
      id: cache-docker
      uses: actions/cache@v4
      with:
        path: /tmp/wp-env-docker-cache
        key: wp-env-docker-${{ hashFiles('.wp-env.json') }}

    - name: Load Docker images from cache
      if: steps.cache-docker.outputs.cache-hit == 'true'
      run: |
        docker load -i /tmp/wp-env-docker-cache/images.tar || \
          echo "Warning: failed to load Docker image cache; wp-env will pull images fresh."

    - name: Start WordPress environment
      run: npm run wp-env start

    - name: Save Docker images to cache
      if: steps.cache-docker.outputs.cache-hit != 'true'
      run: |
        mkdir -p /tmp/wp-env-docker-cache
        docker save -o /tmp/wp-env-docker-cache/images.tar \
          $(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "^(wordpress|mysql|mariadb|nginx):")

    - name: Run E2E tests
      run: npm run test:e2e

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/

    - name: Stop WordPress environment
      if: always()
      run: npm run wp-env stop
